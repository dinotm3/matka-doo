<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48">
  <!-- White background circle (keeps the same "pop" behavior on hover) -->
  <circle cx="24" cy="24" r="23.5" fill="#ffffff"/>

  <!-- Paper with folded corner (thin stroke) -->
  <path
    d="M 11.5 7.8
       H 30.5
       L 36.8 14.1
       V 38.7
       H 11.5
       Z"
    fill="none"
    stroke="#26282f"
    stroke-width="2.2"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Fold detail -->
  <path
    d="M 30.5 7.8 V 14.1 H 36.8"
    fill="none"
    stroke="#26282f"
    stroke-width="2.2"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Magnifier ring (slightly smaller than paper) -->
  <circle
    cx="22.3"
    cy="24.2"
    r="8.1"
    fill="none"
    stroke="#26282f"
    stroke-width="2.4"
  />

  <!-- Magnifier handle (extends toward outer circle edge) -->
  <path
    d="M 28.2 30.0 L 39.3 41.1"
    fill="none"
    stroke="#26282f"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Green checkmark (stroke only) -->
  <path
    d="M 19.2 24.3 L 22.1 27.1 L 26.8 22.1"
    fill="none"
    stroke="#00BF63"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

