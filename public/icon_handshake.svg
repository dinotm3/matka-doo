<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48">
  <!-- white circle background -->
  <circle cx="24" cy="24" r="23.5" fill="#ffffff"/>

  <!-- left person -->
  <circle cx="16" cy="18" r="3.2" fill="none" stroke="#26282f" stroke-width="2.4"/>
  <path
    d="M 12.5 34 V 26.2
       C 12.5 23.8 14.1 22.2 16.5 22.2
       C 18.9 22.2 20.5 23.8 20.5 26.2
       V 34"
    fill="none" stroke="#26282f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- right person -->
  <circle cx="32" cy="18" r="3.2" fill="none" stroke="#26282f" stroke-width="2.4"/>
  <path
    d="M 27.5 34 V 26.2
       C 27.5 23.8 29.1 22.2 31.5 22.2
       C 33.9 22.2 35.5 23.8 35.5 26.2
       V 34"
    fill="none" stroke="#26282f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- arms to handshake -->
  <path d="M 20.2 27.5 L 23.0 29.8" fill="none" stroke="#26282f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 27.8 27.5 L 25.0 29.8" fill="none" stroke="#26282f" stroke-width="2.4" stroke-linecap="round"/>

  <!-- handshake overlap -->
  <path d="M 23.0 29.8 H 25.0" fill="none" stroke="#26282f" stroke-width="2.4" stroke-linecap="round"/>
</svg>
